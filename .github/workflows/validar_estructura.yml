name: Validar Estructura de Contextos de IA

on:
  push:
    branches: [ main, beta, 'release/**' ]
  pull_request:
    branches: [ main, beta, 'release/**' ]

jobs:
  validar_estructura:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validar 7 Secciones Obligatorias en archivos .md de niveles
        run: |
          python -c '
          import os, sys

          required_sections = [
              "1. Identidad y contexto",
              "2. Alcance y límites",
              "3. Errores frecuentes y mitos de la cátedra",
              "4. Reglas pedagógicas y escalamiento de pistas",
              "5. Convenciones de hardware, entorno y formato",
              "6. Directivas de uso responsable y prevención de atajos",
              "7. Prompts de inicio"
          ]

          errors = []
          for root, dirs, files in os.walk("materias"):
              for file in files:
                  if file.endswith(".md"):
                          filepath = os.path.join(root, file)
                          with open(filepath, "r", encoding="utf-8") as f:
                              content = f.read()
                          for sec in required_sections:
                              if sec not in content:
                                  errors.append(f"[{filepath}] Falta la sección obligatoria: \"{sec}\"")

          if errors:
              print("ERRORES ENCONTRADOS EN LA ESTRUCTURA:")
              for err in errors:
                  print(" - " + err)
              sys.exit(1)
          else:
              print("¡Todos los contextos de IA cumplen con las 7 secciones obligatorias!")
          '
