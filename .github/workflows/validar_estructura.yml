name: Validar Estructura de Prompts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validar_estructura:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validar 7 Secciones Obligatorias en archivos .md de niveles
        run: |
          python -c '
          import os, sys

          required_sections = [
              "1. Identidad y Contexto",
              "2. Alcance y Límites",
              "3. Errores Frecuentes y Mitos de la Cátedra",
              "4. Reglas Pedagógicas y Escalamiento de Pistas",
              "5. Convenciones de Hardware, Entorno y Formato",
              "6. Directivas de Uso Responsable y Prevención de Atajos",
              "7. Prompts de Inicio"
          ]

          errors = []
          for root, dirs, files in os.walk("materias"):
              for file in files:
                  if file.endswith(".md"):
                          filepath = os.path.join(root, file)
                          with open(filepath, "r", encoding="utf-8") as f:
                              content = f.read()
                          for sec in required_sections:
                              if sec not in content:
                                  errors.append(f"[{filepath}] Falta la sección obligatoria: \"{sec}\"")

          if errors:
              print("ERRORES ENCONTRADOS EN LA ESTRUCTURA:")
              for err in errors:
                  print(" - " + err)
              sys.exit(1)
          else:
              print("¡Todos los prompts cumplen con las 7 secciones obligatorias!")
          '
