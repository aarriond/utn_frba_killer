name: Auto Crear Rama para Issue

# Este workflow escucha la apertura o asignación de un Issue en GitHub
# y genera automáticamente una rama dedicada:
# - fix/<numero> si el issue tiene etiqueta 'bug' o 'bugfix'
# - feature/<numero> para el resto de los casos

on:
  issues:
    types: [opened, assigned]

jobs:
  create_branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Determinar tipo y crear rama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          # Determinar si es bugfix o feature según etiquetas o título
          if echo "$LABELS" | grep -iq -E "bug|bugfix" || echo "$ISSUE_TITLE" | grep -iq "^bug:"; then
            PREFIX="fix"
          else
            PREFIX="feature"
          fi
          
          BRANCH_NAME="${PREFIX}/${ISSUE_NUMBER}"
          
          # Verificar si la rama ya existe en el remoto
          git fetch origin
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            echo "ℹ️ La rama $BRANCH_NAME ya existe."
          else
            echo "🚀 Creando la rama $BRANCH_NAME..."
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
            
            # Dejar comentario en el Issue con instrucciones para el desarrollador
            gh issue comment "$ISSUE_NUMBER" --body "🤖 **Rama creada automáticamente**: \`$BRANCH_NAME\`
            
            Para empezar a trabajar en este issue:
            \`\`\`bash
            git fetch origin
            git checkout $BRANCH_NAME
            \`\`\`"
          fi

