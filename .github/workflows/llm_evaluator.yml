name: Evaluador LLM (Red Teaming)

on:
  workflow_dispatch:
    inputs:
      enable_api:
        description: 'Habilitar llamadas a la API de Gemini (consume cuota)'
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [ main, beta, 'release/**' ]
    types: [opened, synchronize, reopened]

jobs:
  red_teaming_eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar Suite de Red Teaming contra Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_RED_TEAMING: ${{ inputs.enable_api && 'true' || 'false' }}
        run: |
          python tests/test_red_teaming.py
