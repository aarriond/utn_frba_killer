name: Evaluador LLM (Red Teaming)

# Este workflow ejecuta pruebas de Red Teaming contra contextos de IA.
# Por defecto utiliza la API de Google Gemini (Free Tier).
# Se puede habilitar manualmente o correr en Pull Requests hacia release/* y main.

on:
  workflow_dispatch:
    inputs:
      enable_api:
        description: 'Habilitar llamadas a la API de Gemini (consume cuota)'
        required: false
        type: boolean
        default: true
  push:
    branches: [ main, beta, 'release/**' ]
  pull_request:
    branches: [ main, beta, 'release/**' ]
    types: [opened, synchronize, reopened]

jobs:
  red_teaming_eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar Suite de Red Teaming contra Gemini API
        env:
          # Proveedor Activo:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # Proveedores Adicionales (Preparados para cuando agregues sus claves en Secrets):
          # GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          
          ENABLE_RED_TEAMING: ${{ inputs.enable_api && 'true' || 'false' }}
        run: |
          python tests/test_red_teaming.py

